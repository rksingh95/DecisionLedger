[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision-ledger-sdk"
version = "0.1.0"
description = "Append-only decision ledger SDK for AI agents in regulated environments"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mandate", email = "contributors@mandate.ai" }]
requires-python = ">=3.13"
keywords = ["ai", "compliance", "audit", "ledger", "eu-ai-act", "decision-logging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Logging",
]
dependencies = [
    "pydantic>=2.13.0,<3.0.0",
    "fastapi>=0.136.0,<1.0.0",
    "uvicorn[standard]>=0.46.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.49,<3.0.0",
    "asyncpg>=0.31.0,<1.0.0",
    "alembic>=1.18.0,<2.0.0",
    "httpx>=0.28.1,<1.0.0",
    "typer>=0.24.0,<1.0.0",
    "uuid6>=2022.10.25",
    "python-dotenv>=1.2.2,<2.0.0",
    "rich>=15.0.0,<16.0.0",
    "aiosqlite>=0.22.1,<1.0.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3.0"]
opentelemetry = ["opentelemetry-api>=1.28.0"]
server = [
    "fastapi>=0.136.0,<1.0.0",
    "uvicorn[standard]>=0.46.0,<1.0.0",
    "gunicorn>=21.2.0,<22.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0,<8.0.0",
    "sqlalchemy[asyncio]>=2.0.49,<3.0.0",
    "asyncpg>=0.31.0,<1.0.0",
    "alembic>=1.18.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "reportlab>=4.2.0,<5.0.0",
]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "httpx>=0.28.1,<1.0.0",
    "ruff>=0.15.0,<1.0.0",
    "mypy>=1.20.0,<2.0.0",
    "pytest-mock>=3.15.1",
    "pre-commit>=4.0.0,<5.0.0",
]

[project.scripts]
dai = "cli.main:app"

[project.urls]
Homepage = "https://github.com/rksingh95/DecisionLedger"
Repository = "https://github.com/rksingh95/DecisionLedger"
Documentation = "https://github.com/rksingh95/DecisionLedger#readme"
Issues = "https://github.com/rksingh95/DecisionLedger/issues"

[tool.hatch.build.targets.sdist]
include = ["/dai", "/dai_server", "/cli", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["dai", "dai_server", "cli"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["dai", "dai_server", "cli"]

[tool.mypy]
strict = true
python_version = "3.13"
ignore_missing_imports = true
exclude = ["tests/", "migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["dai", "dai_server", "cli"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
